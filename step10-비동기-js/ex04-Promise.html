<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise란? - 자바스크립트내장객체</h1>
    <script>
      console.log("시작하기");
      const promise = new Promise((resolve, reject) => {
        setTimeout(() => {
          console.log(resolve);
          console.log(reject);
          //   resolve("성공 결과값");
          //   resolve({ id: "jang", age: 30 });
          reject("실패 결과 값");
        }, 2000);
      });
      console.log(promise);
      promise
        .then((re) => {
          console.log(re);
        })
        .catch((err) => {
          console.log(err);
        })
        .finally(() => {
          console.log("종료 항상 실행이 된다.");
        });
    </script>
  </body>
</html>
