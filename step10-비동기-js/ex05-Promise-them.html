<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <h1>Promise then 사용하기(하나, 둘, 셋.. 동기적으로 출력)</h1>
    <script>
      const taskA = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("하나");
          }, 2000);
        });
      };
      const taskB = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("둘");
          }, 1000);
        });
      };
      const taskC = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("셋");
          }, 1500);
        });
      };
      taskA()
        .then((re) => {
          console.log("taskA :>> ", re);
          taskB().then((re) => {
            console.log("taskB :>> ", re);
          });

          //   return taskB();
        })
        // .then((re) => {
        //   console.log("taskB :>> ", re);
        //   return taskC();
        // })
        // .then((re) => {
        //   console.log("taskC :>> ", re);
        // })
        .catch();
    </script>
  </body>
</html>
