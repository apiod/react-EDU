<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Promise then 사용하기(하나, 둘, 셋.. 동기적으로 출력)</h1>
    <script>
      const taskA = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("하나");
          }, 2000);
        });
      };
      const taskB = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            // resolve("둘");
            // reject(new Error("error객체를 이용한 에러메세지"));
          }, 1000);
        });
      };
      const taskC = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve("셋");
          }, 1500);
        });
      };
      const test = async () => {
        try {
          let resultA = await taskA();
          console.log(resultA);
          let resultB = await taskB();
          console.log(resultB);
          let resultC = await taskC();
          console.log(resultC);
        } catch (error) {
          console.error(error);
        } finally {
          console.log("종료");
        }
      };
      const re = test();
      console.log(re);
    </script>
  </body>
</html>
