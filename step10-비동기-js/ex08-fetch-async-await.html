<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>fetch()함수 / async, await 이용 -외부와 통신하기</h1>
    <button onclick="selectAllUsers()">데이터 가져오기</button>

    <script>
      const selectAllUsers = async () => {
        const re = await fetch(`https://jsonplaceholder.typicode.com/users`);
        console.log(re);
        const rejson = await re.json();
        console.log(rejson);
      };
    </script>
  </body>
</html>
